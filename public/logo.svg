<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="40" fill="#0f0f0f"/>
  
  <!-- Terminal window header -->
  <rect x="20" y="30" width="160" height="20" rx="4" fill="#1a1a1a"/>
  <circle cx="30" cy="40" r="3" fill="#ef4444"/>
  <circle cx="40" cy="40" r="3" fill="#eab308"/>
  <circle cx="50" cy="40" r="3" fill="#22c55e"/>
  
  <!-- Terminal body -->
  <rect x="20" y="50" width="160" height="120" fill="#1a1a1a"/>
  
  <!-- Terminal prompt text -->
  <text x="30" y="75" font-family="monospace" font-size="14" fill="#22c55e">dev@enigma</text>
  <text x="105" y="75" font-family="monospace" font-size="14" fill="#60a5fa">~</text>
  <text x="115" y="75" font-family="monospace" font-size="14" fill="#ffffff">$</text>
  
  <!-- Cursor/command -->
  <rect x="30" y="85" width="8" height="14" fill="#60a5fa" opacity="0.8"/>
  
  <!-- Code symbol -->
  <text x="30" y="120" font-family="monospace" font-size="32" fill="#9ca3af" opacity="0.5">&lt;/&gt;</text>
</svg>
