<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#fafafa" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700">sed vs fs_write</text>
  <text x="600" y="150" text-anchor="middle" fill="#737373" font-family="Inter, system-ui, sans-serif" font-size="24">Token Cost Comparison</text>
  
  <!-- sed box -->
  <rect x="100" y="200" width="450" height="320" rx="16" fill="#1f1f1f" stroke="#ef4444" stroke-width="2"/>
  <text x="325" y="250" text-anchor="middle" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700">sed</text>
  <text x="325" y="300" text-anchor="middle" fill="#737373" font-family="Inter, sans-serif" font-size="18">3,800 tokens</text>
  <text x="325" y="340" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="48" font-weight="700">Rp 468</text>
  <text x="325" y="390" text-anchor="middle" fill="#737373" font-family="Inter, sans-serif" font-size="16">30% success rate</text>
  <text x="325" y="420" text-anchor="middle" fill="#737373" font-family="Inter, sans-serif" font-size="16">High corruption risk</text>
  <text x="325" y="480" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="24">❌</text>
  
  <!-- fs_write box -->
  <rect x="650" y="200" width="450" height="320" rx="16" fill="#1f1f1f" stroke="#22c55e" stroke-width="2"/>
  <text x="875" y="250" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700">fs_write</text>
  <text x="875" y="300" text-anchor="middle" fill="#737373" font-family="Inter, sans-serif" font-size="18">1,400 tokens</text>
  <text x="875" y="340" text-anchor="middle" fill="#22c55e" font-family="Inter, sans-serif" font-size="48" font-weight="700">Rp 172</text>
  <text x="875" y="390" text-anchor="middle" fill="#737373" font-family="Inter, sans-serif" font-size="16">95% success rate</text>
  <text x="875" y="420" text-anchor="middle" fill="#737373" font-family="Inter, sans-serif" font-size="16">Safe & predictable</text>
  <text x="875" y="480" text-anchor="middle" fill="#22c55e" font-family="Inter, sans-serif" font-size="24">✓</text>
  
  <!-- Savings badge -->
  <rect x="475" y="550" width="250" height="50" rx="25" fill="#22c55e"/>
  <text x="600" y="583" text-anchor="middle" fill="#0f0f0f" font-family="Inter, sans-serif" font-size="20" font-weight="700">63% lebih hemat</text>
</svg>
